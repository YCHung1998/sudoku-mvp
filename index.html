<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>網頁版數獨遊戲</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Arial', 'Microsoft YaHei', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            padding: 30px;
            max-width: 600px;
            width: 100%;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 20px;
            font-size: 28px;
        }

        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .difficulty-group {
            display: flex;
            gap: 8px;
        }

        button {
            padding: 10px 16px;
            font-size: 14px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.2s;
            font-weight: bold;
        }

        .difficulty-btn {
            background: #f0f0f0;
            color: #333;
            border: 2px solid #ddd;
        }

        .difficulty-btn:hover {
            background: #e0e0e0;
        }

        .difficulty-btn.active {
            background: #667eea;
            color: white;
            border-color: #667eea;
        }

        .action-btn {
            background: #764ba2;
            color: white;
        }

        .action-btn:hover {
            background: #5a3880;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .game-info {
            text-align: center;
            margin-bottom: 20px;
            color: #666;
            font-size: 14px;
        }

        .board-container {
            display: flex;
            justify-content: center;
            margin-bottom: 20px;
        }

        .sudoku-board {
            display: inline-grid;
            grid-template-columns: repeat(9, 40px);
            grid-template-rows: repeat(9, 40px);
            gap: 0;
            border: 3px solid #333;
        }

        .sudoku-cell {
            width: 40px;
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 20px;
            font-weight: bold;
            border: 1px solid #ccc;
            cursor: pointer;
            background: white;
            color: #333;
        }

        .sudoku-cell:nth-child(3n) {
            border-right: 2px solid #333;
        }

        .sudoku-cell:nth-child(n+19):nth-child(-n+27),
        .sudoku-cell:nth-child(n+46):nth-child(-n+54) {
            border-bottom: 2px solid #333;
        }

        .sudoku-cell.given {
            background: #f5f5f5;
            font-weight: bold;
            cursor: default;
        }

        .sudoku-cell.selected {
            background: #ffffcc;
            box-shadow: inset 0 0 0 2px #667eea;
        }

        .sudoku-cell.error {
            background: #ffcccc;
        }

        .sudoku-cell.hint {
            color: #aaa;
            font-weight: normal;
            font-size: 14px;
        }

        .keyboard-container {
            margin-bottom: 20px;
        }

        .keyboard {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 8px;
            margin-bottom: 10px;
        }

        .number-btn {
            padding: 12px;
            font-size: 16px;
            border: 2px solid #667eea;
            background: white;
            color: #667eea;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.2s;
        }

        .number-btn:hover {
            background: #667eea;
            color: white;
            transform: scale(1.05);
        }

        .number-btn:active {
            transform: scale(0.95);
        }

        .clear-btn {
            background: #ff6b6b;
            color: white;
            border-color: #ff6b6b;
            padding: 12px;
            font-size: 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            border: none;
            transition: all 0.2s;
        }

        .clear-btn:hover {
            background: #ff5252;
            transform: scale(1.05);
        }

        .toggle-solution {
            display: flex;
            gap: 8px;
            justify-content: center;
        }

        .solution-btn {
            background: #51cf66;
            color: white;
        }

        .solution-btn:hover {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.2);
        }

        .solution-btn.active {
            background: #ff922b;
        }

        .solution-btn.active:hover {
            background: #fd7e14;
        }

        .stats {
            display: flex;
            justify-content: space-around;
            padding: 15px;
            background: #f8f9fa;
            border-radius: 6px;
            margin-top: 15px;
            font-size: 14px;
        }

        .stat-item {
            text-align: center;
        }

        .stat-value {
            font-size: 18px;
            font-weight: bold;
            color: #667eea;
        }

        .stat-label {
            color: #666;
            margin-top: 4px;
        }

        @media (max-width: 480px) {
            .sudoku-board {
                grid-template-columns: repeat(9, 35px);
                grid-template-rows: repeat(9, 35px);
            }

            .sudoku-cell {
                width: 35px;
                height: 35px;
                font-size: 16px;
            }

            .container {
                padding: 20px;
            }

            h1 {
                font-size: 22px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>數獨遊戲</h1>

        <div class="controls">
            <div class="difficulty-group">
                <button class="difficulty-btn active" data-difficulty="easy">初階</button>
                <button class="difficulty-btn" data-difficulty="medium">中階</button>
                <button class="difficulty-btn" data-difficulty="hard">高階</button>
            </div>
            <button class="action-btn" id="newGameBtn">新遊戲</button>
        </div>

        <div class="game-info">
            <div id="difficultyInfo">難度: 初階</div>
        </div>

        <div class="board-container">
            <div class="sudoku-board" id="sudokuBoard"></div>
        </div>

        <div class="keyboard-container">
            <div class="keyboard" id="numberKeyboard"></div>
            <div style="display: flex; gap: 8px;">
                <button class="clear-btn" id="clearBtn" style="flex: 1;">清除</button>
                <button class="solution-btn" id="solutionBtn" style="flex: 1;">顯示解答</button>
            </div>
        </div>

        <div class="stats">
            <div class="stat-item">
                <div class="stat-label">已填入</div>
                <div class="stat-value" id="filledCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">錯誤</div>
                <div class="stat-value" id="errorCount">0</div>
            </div>
            <div class="stat-item">
                <div class="stat-label">進度</div>
                <div class="stat-value" id="progressPercent">0%</div>
            </div>
        </div>
    </div>

    <script type="module">
        import { calculateProgressPercent } from './progress-logic.mjs';

        const BOARD_SIZE = 9;
        const SUBGRID_SIZE = 3;

        class SudokuGame {
            constructor() {
                this.solution = [];
                this.puzzle = [];
                this.userBoard = [];
                this.selectedCell = null;
                this.showingSolution = false;
                this.difficulty = 'easy';
                this.cellsToRemove = { easy: 35, medium: 45, hard: 55 };

                this.initializeGame();
                this.setupEventListeners();
            }

            initializeGame() {
                this.solution = this.generateSudoku();
                this.puzzle = this.createPuzzle(this.solution, this.difficulty);
                this.userBoard = this.puzzle.map(row => [...row]);
            }

            generateSudoku() {
                const board = Array(BOARD_SIZE).fill(null).map(() => Array(BOARD_SIZE).fill(0));
                this.fillDiagonal(board);
                if (this.solveSudoku(board)) {
                    return board.map(row => [...row]);
                }
                return this.generateSudoku();
            }

            fillDiagonal(board) {
                for (let box = 0; box < BOARD_SIZE; box += SUBGRID_SIZE) {
                    const numbers = Array.from({ length: BOARD_SIZE }, (_, i) => i + 1);
                    this.shuffle(numbers);
                    for (let i = 0; i < SUBGRID_SIZE; i++) {
                        for (let j = 0; j < SUBGRID_SIZE; j++) {
                            board[box + i][box + j] = numbers[i * SUBGRID_SIZE + j];
                        }
                    }
                }
            }

            solveSudoku(board) {
                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        if (board[row][col] === 0) {
                            const candidates = this.getValidNumbers(board, row, col);
                            for (const num of candidates) {
                                board[row][col] = num;
                                if (this.solveSudoku(board)) {
                                    return true;
                                }
                                board[row][col] = 0;
                            }
                            return false;
                        }
                    }
                }
                return true;
            }

            getValidNumbers(board, row, col) {
                const valid = new Set(Array.from({ length: BOARD_SIZE }, (_, i) => i + 1));

                for (let i = 0; i < BOARD_SIZE; i++) {
                    if (board[row][i] !== 0) valid.delete(board[row][i]);
                    if (board[i][col] !== 0) valid.delete(board[i][col]);
                }

                const boxRow = Math.floor(row / SUBGRID_SIZE) * SUBGRID_SIZE;
                const boxCol = Math.floor(col / SUBGRID_SIZE) * SUBGRID_SIZE;
                for (let i = boxRow; i < boxRow + SUBGRID_SIZE; i++) {
                    for (let j = boxCol; j < boxCol + SUBGRID_SIZE; j++) {
                        if (board[i][j] !== 0) valid.delete(board[i][j]);
                    }
                }

                return Array.from(valid).sort(() => Math.random() - 0.5);
            }

            createPuzzle(solution, difficulty) {
                const puzzle = solution.map(row => [...row]);
                const cellsToRemove = this.cellsToRemove[difficulty];
                let removed = 0;

                while (removed < cellsToRemove) {
                    const row = Math.floor(Math.random() * BOARD_SIZE);
                    const col = Math.floor(Math.random() * BOARD_SIZE);

                    if (puzzle[row][col] !== 0) {
                        const backup = puzzle[row][col];
                        puzzle[row][col] = 0;
                        removed++;
                    }
                }

                return puzzle;
            }

            shuffle(array) {
                for (let i = array.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [array[i], array[j]] = [array[j], array[i]];
                }
            }

            setupEventListeners() {
                document.querySelectorAll('.difficulty-btn').forEach(btn => {
                    btn.addEventListener('click', (e) => this.changeDifficulty(e.target));
                });

                document.getElementById('newGameBtn').addEventListener('click', () => this.newGame());
                document.getElementById('clearBtn').addEventListener('click', () => this.clearSelected());
                document.getElementById('solutionBtn').addEventListener('click', () => this.toggleSolution());

                for (let i = 1; i <= 9; i++) {
                    document.querySelector(`[data-number="${i}"]`).addEventListener('click', () => {
                        this.fillCell(i);
                    });
                }

                document.addEventListener('keydown', (e) => this.handleKeyPress(e));
            }

            changeDifficulty(btn) {
                document.querySelectorAll('.difficulty-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
                this.difficulty = btn.dataset.difficulty;
                const diffNames = { easy: '初階', medium: '中階', hard: '高階' };
                document.getElementById('difficultyInfo').textContent = `難度: ${diffNames[this.difficulty]}`;
                this.newGame();
            }

            newGame() {
                this.showingSolution = false;
                document.getElementById('solutionBtn').textContent = '顯示解答';
                document.getElementById('solutionBtn').classList.remove('active');
                this.initializeGame();
                this.selectedCell = null;
                this.render();
                this.updateStats();
            }

            selectCell(row, col) {
                if (this.puzzle[row][col] !== 0) return;
                this.selectedCell = { row, col };
                this.render();
            }

            fillCell(num) {
                if (!this.selectedCell) return;
                const { row, col } = this.selectedCell;
                if (this.puzzle[row][col] !== 0) return;

                this.userBoard[row][col] = num;
                this.selectedCell = null;
                this.render();
                this.updateStats();
            }

            clearSelected() {
                if (!this.selectedCell) return;
                const { row, col } = this.selectedCell;
                if (this.puzzle[row][col] !== 0) return;
                this.userBoard[row][col] = 0;
                this.render();
                this.updateStats();
            }

            toggleSolution() {
                this.showingSolution = !this.showingSolution;
                const btn = document.getElementById('solutionBtn');
                if (this.showingSolution) {
                    btn.textContent = '隱藏解答';
                    btn.classList.add('active');
                } else {
                    btn.textContent = '顯示解答';
                    btn.classList.remove('active');
                }
                this.render();
            }

            handleKeyPress(e) {
                if (e.key >= '1' && e.key <= '9') {
                    this.fillCell(parseInt(e.key));
                } else if (e.key === 'Backspace' || e.key === 'Delete' || e.key === '0') {
                    this.clearSelected();
                }
            }

            isValidCell(row, col, num) {
                for (let i = 0; i < BOARD_SIZE; i++) {
                    if (this.solution[row][i] === num) return false;
                    if (this.solution[i][col] === num) return false;
                }

                const boxRow = Math.floor(row / SUBGRID_SIZE) * SUBGRID_SIZE;
                const boxCol = Math.floor(col / SUBGRID_SIZE) * SUBGRID_SIZE;
                for (let i = boxRow; i < boxRow + SUBGRID_SIZE; i++) {
                    for (let j = boxCol; j < boxCol + SUBGRID_SIZE; j++) {
                        if (this.solution[i][j] === num) return false;
                    }
                }

                return true;
            }

            render() {
                const board = document.getElementById('sudokuBoard');
                board.innerHTML = '';

                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        const cell = document.createElement('div');
                        cell.className = 'sudoku-cell';

                        const isGiven = this.puzzle[row][col] !== 0;
                        if (isGiven) {
                            cell.classList.add('given');
                        }

                        if (this.showingSolution) {
                            cell.textContent = this.solution[row][col];
                            cell.classList.add('hint');
                        } else {
                            const value = this.userBoard[row][col];
                            if (value !== 0) {
                                cell.textContent = value;
                                if (!isGiven && value !== this.solution[row][col]) {
                                    cell.classList.add('error');
                                }
                            }
                        }

                        if (this.selectedCell && this.selectedCell.row === row && this.selectedCell.col === col) {
                            cell.classList.add('selected');
                        }

                        if (!isGiven && !this.showingSolution) {
                            cell.addEventListener('click', () => this.selectCell(row, col));
                        }

                        board.appendChild(cell);
                    }
                }
            }

            updateStats() {
                let filled = 0;
                let given = 0;
                let errors = 0;

                for (let row = 0; row < BOARD_SIZE; row++) {
                    for (let col = 0; col < BOARD_SIZE; col++) {
                        if (this.userBoard[row][col] !== 0) {
                            filled++;
                            if (this.userBoard[row][col] !== this.solution[row][col]) {
                                errors++;
                            }
                        }
                        if (this.puzzle[row][col] !== 0) given++;
                    }
                }

                const totalOpen = this.cellsToRemove[this.difficulty];
                const progress = calculateProgressPercent({ filled, given, totalOpen });

                document.getElementById('filledCount').textContent = filled;
                document.getElementById('errorCount').textContent = errors;
                document.getElementById('progressPercent').textContent = progress + '%';
            }
        }

        function initializeKeyboard() {
            const keyboard = document.getElementById('numberKeyboard');
            for (let i = 1; i <= 9; i++) {
                const btn = document.createElement('button');
                btn.className = 'number-btn';
                btn.textContent = i;
                btn.dataset.number = i;
                keyboard.appendChild(btn);
            }
        }

        document.addEventListener('DOMContentLoaded', () => {
            initializeKeyboard();
            const game = new SudokuGame();
            game.render();
            game.updateStats();
        });
    </script>
</body>
</html>
